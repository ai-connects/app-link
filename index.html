ذكاء الاصطناعي","desc":"HAVIT، مدرّبك بالذكاء الاصطناعي، يساعدك على عيش حياة أكثر صحة.","scan":"امسح الرمز بكاميرا هاتفك لتثبيت التطبيق.","opening":"جارٍ فتح متجر التطبيقات…","fallback":"اضغط هنا إذا لم يحدث شيء","quote":"خطوات صغيرة اليوم تصنع تغييرًا يدوم مدى الحياة.","juvis":"جرّب مدرّبًا بالذكاء الاصطناعي مبنيًا على خبرة خبراء سابقين في Juvis Diet."},"he":{"doc":"הורידו את אפליקציית HAVIT — מאמן ירידה במשקל מבוסס AI","title":"HAVIT — מאמן ירידה במשקל מבוסס AI","desc":"HAVIT, מאמן ה-AI שלכם, עוזר לכם לחיות בריא יותר.","scan":"סרקו עם מצלמת הטלפון כדי להתקין.","opening":"פותחים את חנות האפליקציות…","fallback":"הקישו כאן אם שום דבר לא קורה","quote":"צעדים קטנים היום מעצבים שינוי לכל החיים.","juvis":"נסו מאמן AI שנבנה על הניסיון של מומחים לשעבר ב-Juvis Diet."}};
    var RTL = { ar: 1, he: 1 };
    function pickLang() {
      var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      for (var i = 0; i < list.length; i++) {
        var l = String(list[i]).toLowerCase();
        if (l === 'zh-tw' || l === 'zh-hk' || l === 'zh-mo' || l.indexOf('zh-hant') === 0) return 'zh-tw';
        if (l.indexOf('zh') === 0) return 'zh-cn';
        if (l.indexOf('no') === 0 || l.indexOf('nn') === 0) return 'nb';
        if (l.indexOf('iw') === 0) return 'he';
        if (l.indexOf('in') === 0 && l.length <= 5) return 'id';
        var base = l.split('-')[0];
        if (I18N[base]) return base;
      }
      return 'en';
    }
    var lang = pickLang();
    var T = I18N[lang];
    document.documentElement.lang = lang === 'zh-cn' ? 'zh-Hans' : lang === 'zh-tw' ? 'zh-Hant' : lang;
    if (RTL[lang]) document.documentElement.dir = 'rtl';
    document.title = T.doc;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      var k = el.getAttribute('data-t'); if (T[k]) el.textContent = T[k];
    });

    // ── 귀속: 스토어 직링크 대신 AppsFlyer OneLink(crNQ) 로 보낸다 ─────────────────
    // 직링크로 나가면 이 링크를 거친 설치가 AppsFlyer 에 전부 오가닉으로 잡힌다.
    //
    // 우선순위 (위에서 걸리면 아래는 안 본다)
    //  1) 이미 pid 가 붙어 온 링크  → 받은 쿼리를 **한 글자도 바꾸지 않고** 그대로 넘긴다.
    //     impact.com 등 파트너가 af_siteid / af_sub1~4 / clickid 를 실어 보내는 경우를 보존하기 위함.
    //     (서버 affiliate_external_touch_usecase 는 pid=impactradius_int 일 때 af_sub1~4·clickid 를 읽는다)
    //  2) irclickid (impact 딥링크)   → pid=impactradius_int, clickid=irclickid
    //  3) oppref (ChatGPT 광고 클릭 ID, OpenAI 가 자동 부착) → pid=openai_int, clickid=oppref
    //  4) utm_source                  → 홈페이지 Smart Script 와 같은 매체 이름(*_web)
    //  5) ch (우리가 직접 만든 링크) → pid=ch 값 그대로(소문자). utm_source 와 달리 *_web 으로 바꾸지 않아
    //     ch=instagram 같은 무료 유입이 유료 웹 광고(meta_web)와 섞이지 않는다.
    //     utm_source 보다 아래인 이유: 서버 랜딩(/qr/·추천인 등)은 매체를 utm_source 로 정해 보내면서 랜딩 주소의
    //     나머지 값을 그대로 넘기고, 광고 플랫폼도 utm_source 를 덧붙인다 — 둘 다 링크에 박힌 ch 보다 우선해야 한다.
    //     광고 클릭 ID 보다는 위라 페이스북 등이 fbclid 를 자동으로 붙여도 ch 가 이긴다.
    //  6) 광고 클릭 ID                → google_web / meta_web / tiktok_web
    //  7) 아무것도 없음               → pid=website, c=app_link (자사 링크)
    // 1) 이외에는 utm_*·ch 외의 받은 파라미터를 그대로 덧붙인다(파트너가 보낸 값을 버리지 않는다).
    var ONELINK = 'https://havit.onelink.me/crNQ';
    var p = new URLSearchParams(location.search);
    var debug = p.get('_debug') === '1';
    p.delete('_debug');

    var WEB_SOURCE = {
      facebook: 'meta_web', fb: 'meta_web', instagram: 'meta_web', ig: 'meta_web', meta: 'meta_web',
      google: 'google_web', youtube: 'google_web', tiktok: 'tiktok_web', naver: 'naver_web', kakao: 'kakao_web',
      chatgpt: 'openai_int', openai: 'openai_int'
    };

    function buildQuery() {
      if (p.has('pid')) return { q: new URLSearchParams(p), rule: 'passthrough' };
      var q = new URLSearchParams();
      // utm_*·ch 는 아래에서 AppsFlyer 칸으로 옮기고, 나머지(파트너 값·클릭 ID)는 그대로 실어 보낸다.
      p.forEach(function (v, k) { if (k.indexOf('utm_') !== 0 && k !== 'ch') q.append(k, v); });
      var pid, rule;
      var ch = (p.get('ch') || '').trim().toLowerCase();
      if (p.has('irclickid')) { pid = 'impactradius_int'; q.set('clickid', p.get('irclickid')); rule = 'impact'; }
      else if (p.has('oppref')) { pid = 'openai_int'; q.set('clickid', p.get('oppref')); rule = 'chatgpt'; }
      else if (p.has('utm_source')) {
        var s = p.get('utm_source').toLowerCase(); pid = WEB_SOURCE[s] || s; rule = 'utm';
      }
      else if (ch) { pid = ch; rule = 'ch'; }
      else if (p.has('gclid') || p.has('gbraid') || p.has('wbraid')) { pid = 'google_web'; rule = 'clickid'; }
      else if (p.has('fbclid')) { pid = 'meta_web'; rule = 'clickid'; }
      else if (p.has('ttclid')) { pid = 'tiktok_web'; rule = 'clickid'; }
      else { pid = 'website'; rule = 'owned'; }
      q.set('pid', pid);
      if (!q.has('c')) q.set('c', p.get('utm_campaign') || 'app_link');
      if (p.has('utm_medium') && !q.has('af_channel')) q.set('af_channel', p.get('utm_medium'));
      if (p.has('utm_content') && !q.has('af_ad')) q.set('af_ad', p.get('utm_content'));
      // keyword 는 Google Ads 최종 URL 접미사의 {keyword} 자리. 홈페이지 Smart Script 시절 af_keywords 로 들어가던 값이라
      // utm_term 보다 먼저 쓴다(리포트 연속성). utm_* 처럼 칸으로 옮기므로 원래 키는 빼낸다.
      if (p.has('keyword') && !q.has('af_keywords')) { q.set('af_keywords', p.get('keyword')); q.delete('keyword'); }
      if (p.has('utm_term') && !q.has('af_keywords')) q.set('af_keywords', p.get('utm_term'));
      if (!q.has('af_adset')) q.set('af_adset', 'app_link');
      // ChatGPT Ads(openai_int) 연동의 어트리뷰션 링크와 같은 값을 맞춘다. 이 링크 대신 우리가 직접 만든 OneLink 를 쓰므로,
      // 빠지면 클릭 귀속 기간이 AppsFlyer 기본(7일)으로 떨어져 ChatGPT 광고 관리자(30일 고정)와 숫자가 어긋난다.
      if (pid === 'openai_int') {
        if (!q.has('af_click_lookback')) q.set('af_click_lookback', '30d');
        if (!q.has('af_siteid')) q.set('af_siteid', 'chatgpt_ads');
      }
      return { q: q, rule: rule };
    }

    var ua = navigator.userAgent || navigator.vendor || '';
    var isAndroid = /android/i.test(ua);
    // iPadOS 는 UA 가 Mac 으로 나와서 터치 포인트로 가른다.
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var platform = isAndroid ? 'android' : isIOS ? 'ios' : 'desktop';
    var built = buildQuery();
    // ChatGPT 광고 유입 = oppref(OpenAI 클릭 ID) 또는 pid=openai_int 로 귀속되는 경우.
    var fromChatGPT = built.q.get('pid') === 'openai_int' || p.has('oppref');
    var target = ONELINK + '?' + built.q.toString();

    if (debug) {
      var d = document.getElementById('debug');
      d.hidden = false;
      d.textContent = 'platform=' + platform + '\nrule=' + built.rule + '\ntarget=' + target;
    }

    if (platform === 'desktop') {
      // PC 는 설치할 수 없으니 이동하지 않는다. QR 에는 폰에서 만들 OneLink 를 그대로 담는다 —
      // 폰이 이 페이지를 다시 거치지 않고 바로 OneLink 로 가며, 귀속 값도 같다.
      // (예전엔 지금 주소를 담았는데, 로컬에선 localhost 가 들어가 폰에서 열리지 않았다.)
      // 파트너 링크(passthrough)와 af_adset 을 직접 받은 경우는 손대지 않고,
      // 그 외에는 af_adset=desktop_qr 로 PC→QR 경유 클릭·설치를 AppsFlyer 에서 구분한다.
      var qrQuery = new URLSearchParams(built.q);
      if (built.rule !== 'passthrough' && !p.has('af_adset')) qrQuery.set('af_adset', 'desktop_qr');
      var qrTarget = ONELINK + '?' + qrQuery.toString();
      if (debug) document.getElementById('debug').textContent += '\nqr=' + qrTarget;
      try {
        var qr = qrcode(0, 'M');
        qr.addData(qrTarget);
        qr.make();
        document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      } catch (e) { document.getElementById('qr').style.display = 'none'; }
      gtag('event', 'app_redirect', { platform: platform, media_source: built.q.get('pid'), rule: built.rule, destination: 'qr_page' });
      if (fromChatGPT) {
        oaiq('measure', 'page_viewed', { type: 'contents', contents: [{ id: 'app_link_qr', name: 'App download QR page', content_type: 'page' }] });
      }
      return;
    }

    document.body.classList.add('is-mobile');
    document.getElementById('fallback').setAttribute('href', target);
    if (debug) return;

    // 계측과 속도의 절충: gtag 는 async 라 바로 이동하면 히트가 유실된다.
    // 전송 콜백으로 넘기되 350ms 에서 무조건 끊는다.
    var moved = false;
    function go() { if (moved) return; moved = true; window.location.replace(target); }
    // ChatGPT 광고 유입이면 스토어로 넘기기 직전을 OpenAI 픽셀 전환(app_store_redirect)으로 보낸다.
    // 픽셀 스크립트가 아직 안 떴을 수 있어 이 경우에만 최대 900ms 기다린다(그 외 유입은 350ms 그대로).
    var waitMs = 350;
    if (fromChatGPT) {
      oaiq('measure', 'custom', { type: 'custom' }, { custom_event_name: 'app_store_redirect' });
      waitMs = 900;
    }
    gtag('event', 'app_redirect', {
      platform: platform, media_source: built.q.get('pid'), rule: built.rule, destination: 'onelink',
      event_callback: fromChatGPT ? undefined : go, event_timeout: 350
    });
    setTimeout(go, waitMs);
  })();
  </script>
